backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: "https://test-website-shuvo-dev.netlify.app"
display_url: "https://test-website-shuvo-dev.netlify.app"
logo_url: "/uploads/logo-trimming-edge.png"

collections:
  - name: "site_settings"
    label: "Site Settings"
    files:
      - file: "src/content/site.json"
        label: "Site Info"
        name: "site"
        format: "json"
        fields:
          - { label: "Business Name", name: "businessName", widget: "string" }
          - { label: "Company Name", name: "companyName", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Phone Link", name: "phoneHref", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Email Link", name: "emailHref", widget: "string" }
          - { label: "Location", name: "location", widget: "string" }
          - { label: "Address", name: "address", widget: "text" }
          - { label: "Service Area Text", name: "serviceAreaText", widget: "text" }
          - { label: "Logo", name: "logo", widget: "image" }
          - { label: "Footer Description", name: "footerDescription", widget: "text", required: false }
          - { label: "Copyright Text", name: "copyrightText", widget: "string", required: false }
          - label: "Business Hours"
            name: "hours"
            widget: "list"
            field: { label: "Hours Line", name: "line", widget: "string" }
          - label: "Short Business Hours"
            name: "shortHours"
            widget: "list"
            field: { label: "Hours Line", name: "line", widget: "string" }
          - label: "Social Links"
            name: "socialLinks"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "href", widget: "string" }
              - label: "Icon"
                name: "iconKey"
                widget: "select"
                options: ["facebook", "instagram"]
          - { label: "Client Login URL", name: "clientLoginUrl", widget: "string" }
          - { label: "Booking URL", name: "bookingUrl", widget: "string", required: false }
          - label: "Claims"
            name: "claims"
            widget: "list"
            field: { label: "Claim", name: "claim", widget: "string" }

      - file: "src/content/navigation.json"
        label: "Navigation"
        name: "navigation"
        format: "json"
        fields:
          - &nav_list
            label: "Main Links"
            name: "main"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Path", name: "path", widget: "string" }
          - <<: *nav_list
            label: "Services Dropdown"
            name: "services"
          - <<: *nav_list
            label: "About Dropdown"
            name: "about"
          - <<: *nav_list
            label: "Service Areas Dropdown"
            name: "serviceAreas"

      - file: "src/content/seo.json"
        label: "SEO Defaults and Routes"
        name: "seo"
        format: "json"
        fields:
          - { label: "Default Title", name: "defaultTitle", widget: "string" }
          - { label: "Default Description", name: "defaultDescription", widget: "text" }
          - { label: "Site URL", name: "siteUrl", widget: "string" }
          - { label: "Default OG Image", name: "ogImage", widget: "image", required: false }
          - label: "Robots"
            name: "robots"
            widget: "select"
            options: ["noindex, nofollow", "index, follow"]
            default: "noindex, nofollow"
          - label: "Route SEO"
            name: "routes"
            widget: "object"
            required: false
            fields:
              - &route_seo
                label: "Home"
                name: "/"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Keywords", name: "keywords", widget: "text", required: false }
                  - { label: "Canonical", name: "canonical", widget: "string" }
                  - { label: "OG Title", name: "ogTitle", widget: "string", required: false }
                  - { label: "OG Description", name: "ogDescription", widget: "text", required: false }
                  - { label: "OG Image", name: "ogImage", widget: "image", required: false }
                  - label: "Robots"
                    name: "robots"
                    widget: "select"
                    options: ["noindex, nofollow", "index, follow"]
                    default: "noindex, nofollow"
              - <<: *route_seo
                label: "Services"
                name: "/services"
              - <<: *route_seo
                label: "About"
                name: "/about"
              - <<: *route_seo
                label: "Contact"
                name: "/contact-us"
              - <<: *route_seo
                label: "Blog"
                name: "/blog"

  - name: "page_content"
    label: "Page Content"
    files:
      - file: "src/content/home.json"
        label: "Home"
        name: "home"
        format: "json"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Badges", name: "badge", widget: "list", field: { label: "Badge", name: "badge", widget: "string" } }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Highlight", name: "highlight", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text" }
          - label: "About"
            name: "about"
            widget: "object"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Eyebrow", name: "eyebrow", widget: "string", required: false }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Paragraphs", name: "paragraphs", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }
          - label: "Free Estimate"
            name: "freeEstimate"
            widget: "object"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

      - file: "src/content/services.json"
        label: "Services"
        name: "services"
        format: "json"
        fields:
          - label: "Service Cards"
            name: "items"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "number", value_type: "int" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Icon"
                name: "icon"
                widget: "select"
                options: ["ri-plant-line", "ri-seedling-line", "ri-leaf-line", "ri-broom-line", "ri-contrast-drop-line", "ri-building-line"]
              - { label: "Image", name: "image", widget: "image" }

      - file: "src/content/servicePages.json"
        label: "Service Detail Pages"
        name: "servicePages"
        format: "json"
        fields:
          - label: "Pages"
            name: "pages"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Slug", name: "slug", widget: "string" }
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Hero Title", name: "heroTitle", widget: "string" }
              - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
              - { label: "Hero Image", name: "heroImage", widget: "image" }
              - { label: "Hero Primary Label", name: "heroPrimaryLabel", widget: "string" }
              - { label: "Hero Primary URL", name: "heroPrimaryHref", widget: "string" }
              - { label: "Hero Secondary Label", name: "heroSecondaryLabel", widget: "string" }
              - { label: "Hero Secondary URL", name: "heroSecondaryHref", widget: "string" }
              - { label: "Overview Title", name: "overviewTitle", widget: "string" }
              - label: "Overview Text"
                name: "overviewText"
                widget: "list"
                field: { label: "Paragraph", name: "paragraph", widget: "text" }
              - { label: "Detail Image", name: "detailImage", widget: "image" }
              - { label: "Detail Image Alt Text", name: "detailImageAlt", widget: "string" }
              - { label: "Overview CTA Label", name: "overviewCtaLabel", widget: "string", required: false }
              - { label: "Overview CTA URL", name: "overviewCtaHref", widget: "string", required: false }
              - { label: "Benefits Title", name: "benefitsTitle", widget: "string" }
              - label: "Benefits"
                name: "benefits"
                widget: "list"
                required: false
                field: { label: "Benefit", name: "benefit", widget: "string" }
              - { label: "Includes Title", name: "includesTitle", widget: "string" }
              - label: "Includes"
                name: "includes"
                widget: "list"
                required: false
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Image", name: "image", widget: "image", required: false }
                  - { label: "Image Alt Text", name: "imageAlt", widget: "string", required: false }
                  - { label: "Badge", name: "badge", widget: "string", required: false }
                  - { label: "Items", name: "items", widget: "list", required: false, field: { label: "Item", name: "item", widget: "string" } }
              - { label: "Process Title", name: "processTitle", widget: "string" }
              - label: "Process Steps"
                name: "processSteps"
                widget: "list"
                required: false
                fields:
                  - label: "Icon"
                    name: "iconKey"
                    widget: "select"
                    options: ["building", "calendar", "community", "discuss", "draft", "drop", "eye", "homeOffice", "phone", "plant", "scissors", "shield", "star", "store", "temperature", "tree", "wind"]
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
              - { label: "FAQ Section Title", name: "faqTitle", widget: "string" }
              - label: "FAQ"
                name: "faq"
                widget: "list"
                fields:
                  - { label: "Question", name: "question", widget: "string" }
                  - { label: "Answer", name: "answer", widget: "text" }
              - { label: "CTA Title", name: "ctaTitle", widget: "string" }
              - { label: "CTA Text", name: "ctaText", widget: "text" }
              - { label: "CTA Primary Label", name: "ctaPrimaryLabel", widget: "string" }
              - { label: "CTA Primary URL", name: "ctaPrimaryHref", widget: "string" }
              - { label: "CTA Secondary Label", name: "ctaSecondaryLabel", widget: "string" }
              - { label: "CTA Secondary URL", name: "ctaSecondaryHref", widget: "string" }
              - { label: "SEO Title", name: "seoTitle", widget: "string" }
              - { label: "SEO Description", name: "seoDescription", widget: "text" }
              - { label: "SEO Keywords", name: "seoKeywords", widget: "text", required: false }
              - { label: "OG Image", name: "ogImage", widget: "image" }

      - file: "src/content/legal.json"
        label: "Legal Pages"
        name: "legal"
        format: "json"
        fields:
          - label: "Privacy Policy"
            name: "privacy"
            widget: "object"
            fields:
              - { label: "Hero Title", name: "heroTitle", widget: "string" }
              - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
              - { label: "Last Updated", name: "lastUpdated", widget: "string" }
              - label: "Sections"
                name: "sections"
                widget: "list"
                fields:
                  - { label: "Section Title", name: "title", widget: "string" }
                  - { label: "Section Body", name: "body", widget: "text" }
          - label: "Terms & Conditions"
            name: "terms"
            widget: "object"
            fields:
              - { label: "Hero Title", name: "heroTitle", widget: "string" }
              - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
              - { label: "Last Updated", name: "lastUpdated", widget: "string" }
              - label: "Sections"
                name: "sections"
                widget: "list"
                fields:
                  - { label: "Section Title", name: "title", widget: "string" }
                  - { label: "Section Body", name: "body", widget: "text" }
      - file: "src/content/wolfRadio.json"
        label: "Wolf Radio"
        name: "wolfRadio"
        format: "json"
        fields:
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
          - { label: "Hero Image", name: "heroImage", widget: "image", required: false }
          - { label: "Live Label", name: "liveLabel", widget: "string" }
          - { label: "Last Played Label", name: "lastPlayedLabel", widget: "string" }
          - { label: "Intro Title", name: "introTitle", widget: "string" }
          - { label: "Intro Text", name: "introText", widget: "text" }
          - { label: "About Eyebrow", name: "aboutEyebrow", widget: "string" }
          - label: "Sections"
            name: "sections"
            widget: "list"
            fields:
              - { label: "Section Title", name: "title", widget: "string" }
              - { label: "Section Body", name: "body", widget: "text" }
          - label: "Station Facts"
            name: "stationFacts"
            widget: "list"
            fields:
              - label: "Icon"
                name: "iconKey"
                widget: "select"
                options: ["broadcast", "global"]
              - { label: "Label", name: "label", widget: "string" }
          - { label: "Text Logo", name: "textLogo", widget: "string" }
          - { label: "Text Logo Caption", name: "textLogoCaption", widget: "string" }
          - { label: "External Link Label", name: "externalLinkLabel", widget: "string" }
          - { label: "External Link Href", name: "externalLinkHref", widget: "string" }
          - { label: "Podcast Title", name: "podcastTitle", widget: "string" }
          - { label: "Podcast Subtitle", name: "podcastSubtitle", widget: "text" }
          - { label: "Spotify Label", name: "spotifyLabel", widget: "string" }
          - { label: "YouTube Label", name: "youtubeLabel", widget: "string" }
          - { label: "CTA Title", name: "ctaTitle", widget: "string" }
          - { label: "CTA Text", name: "ctaText", widget: "text" }
          - label: "CTA"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Primary Label", name: "primaryLabel", widget: "string" }
              - { label: "Primary Href", name: "primaryHref", widget: "string" }
              - { label: "Secondary Label", name: "secondaryLabel", widget: "string" }
              - { label: "Secondary Href", name: "secondaryHref", widget: "string" }
          - { label: "SEO Title", name: "seoTitle", widget: "string", required: false }
          - { label: "SEO Description", name: "seoDescription", widget: "text", required: false }
          - { label: "OG Image", name: "ogImage", widget: "image", required: false }

      - file: "src/content/serviceAreas.json"
        label: "Service Areas"
        name: "serviceAreas"
        format: "json"
        fields:
          - label: "Service Areas Landing"
            name: "landing"
            widget: "object"
            fields:
              - { label: "Hero Title", name: "heroTitle", widget: "string" }
              - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
              - { label: "Hero Image", name: "heroImage", widget: "image" }
              - { label: "Hero Eyebrow", name: "heroEyebrow", widget: "string", required: false }
              - { label: "Intro Eyebrow", name: "introEyebrow", widget: "string", required: false }
              - { label: "Intro Title", name: "introTitle", widget: "string" }
              - { label: "Intro Text", name: "introText", widget: "text" }
              - { label: "Services Eyebrow", name: "servicesEyebrow", widget: "string", required: false }
              - { label: "Services Title", name: "servicesTitle", widget: "string" }
              - { label: "Services Text", name: "servicesText", widget: "text" }
              - { label: "CTA Title", name: "ctaTitle", widget: "string" }
              - { label: "CTA Text", name: "ctaText", widget: "text" }
              - { label: "CTA Primary Label", name: "ctaPrimaryLabel", widget: "string" }
              - { label: "CTA Primary URL", name: "ctaPrimaryHref", widget: "string" }
              - { label: "SEO Title", name: "seoTitle", widget: "string" }
              - { label: "SEO Description", name: "seoDescription", widget: "text" }
              - { label: "SEO Keywords", name: "seoKeywords", widget: "text", required: false }
              - { label: "OG Image", name: "ogImage", widget: "image" }
          - label: "Locations Page"
            name: "locations"
            widget: "object"
            fields:
              - { label: "Hero Title", name: "heroTitle", widget: "string" }
              - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
              - { label: "Hero Image", name: "heroImage", widget: "image" }
              - { label: "Intro Title", name: "introTitle", widget: "string" }
              - { label: "Intro Text", name: "introText", widget: "text" }
              - { label: "SEO Title", name: "seoTitle", widget: "string" }
              - { label: "SEO Description", name: "seoDescription", widget: "text" }
              - { label: "OG Image", name: "ogImage", widget: "image" }
          - label: "Services"
            name: "services"
            widget: "list"
            fields:
              - label: "Slug"
                name: "slug"
                widget: "select"
                options: ["bush-maintenance", "bush-trimming-services", "commercial-landscaping", "commercial-property-maintenance", "commercial-yard-care", "corporate-landscaping", "edging-services", "enterprise-lawn-services", "garden-mulch-installation", "hedge-cutting-services", "hedge-trimming-services", "landscaping-technology-solutions", "lawn-care", "lawn-care-services", "lawn-mowing-services", "lawn-overseeding", "mulching-services", "organic-mulch-services", "pet-friendly-landscaping", "professional-landscaping", "seasonal-clean-up"]
              - { label: "Label", name: "label", widget: "string" }
              - label: "Icon"
                name: "icon"
                widget: "select"
                options: ["ri-plant-line", "ri-scissors-cut-line", "ri-building-2-line", "ri-tools-line", "ri-building-line", "ri-briefcase-line", "ri-crop-line", "ri-community-line", "ri-seedling-line", "ri-scissors-2-line", "ri-leaf-line", "ri-cpu-line", "ri-plant-fill", "ri-landscape-line", "ri-dashboard-line", "ri-seedling-fill", "ri-recycle-line", "ri-earth-line", "ri-heart-line", "ri-award-line", "ri-sun-line"]
              - { label: "Description", name: "description", widget: "text" }
          - label: "Cities"
            name: "cities"
            widget: "list"
            fields:
              - label: "Slug"
                name: "slug"
                widget: "select"
                options: ["agawam-ma", "huntington-ma", "montgomery-ma", "russell-ma", "southwick-ma", "westfield-ma"]
              - { label: "Name", name: "name", widget: "string" }
              - { label: "State", name: "state", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Hero Title", name: "heroTitle", widget: "string" }
              - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
              - { label: "Hero Image", name: "heroImage", widget: "image" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Highlights", name: "highlights", widget: "list", field: { label: "Highlight", name: "highlight", widget: "string" } }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Image Alt Text", name: "imageAlt", widget: "string" }
              - label: "Icon"
                name: "icon"
                widget: "select"
                options: ["ri-building-2-line", "ri-landscape-line", "ri-home-heart-line", "ri-map-pin-2-line", "ri-building-line", "ri-tree-line"]
              - label: "Available Service Slugs"
                name: "services"
                widget: "list"
                field:
                  label: "Service Slug"
                  name: "service"
                  widget: "select"
                  options: ["bush-maintenance", "bush-trimming-services", "commercial-landscaping", "commercial-property-maintenance", "commercial-yard-care", "corporate-landscaping", "edging-services", "enterprise-lawn-services", "garden-mulch-installation", "hedge-cutting-services", "hedge-trimming-services", "landscaping-technology-solutions", "lawn-care", "lawn-care-services", "lawn-mowing-services", "lawn-overseeding", "mulching-services", "organic-mulch-services", "pet-friendly-landscaping", "professional-landscaping", "seasonal-clean-up"]
              - { label: "About Title", name: "aboutTitle", widget: "string" }
              - { label: "About Text", name: "aboutText", widget: "text" }
              - { label: "CTA Title", name: "ctaTitle", widget: "string" }
              - { label: "CTA Text", name: "ctaText", widget: "text" }
              - { label: "CTA Primary Label", name: "ctaPrimaryLabel", widget: "string" }
              - { label: "CTA Primary URL", name: "ctaPrimaryHref", widget: "string" }
              - { label: "CTA Secondary Label", name: "ctaSecondaryLabel", widget: "string" }
              - { label: "CTA Secondary URL", name: "ctaSecondaryHref", widget: "string" }
              - { label: "SEO Title", name: "seoTitle", widget: "string" }
              - { label: "SEO Description", name: "seoDescription", widget: "text" }
              - { label: "OG Image", name: "ogImage", widget: "image" }
          - label: "City Service Pages"
            name: "cityServices"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - label: "City Slug"
                name: "citySlug"
                widget: "select"
                options: ["agawam-ma", "huntington-ma", "montgomery-ma", "russell-ma", "southwick-ma", "westfield-ma"]
              - label: "Service Slug"
                name: "serviceSlug"
                widget: "select"
                options: ["bush-maintenance", "bush-trimming-services", "commercial-landscaping", "commercial-property-maintenance", "commercial-yard-care", "corporate-landscaping", "edging-services", "enterprise-lawn-services", "garden-mulch-installation", "hedge-cutting-services", "hedge-trimming-services", "landscaping-technology-solutions", "lawn-care", "lawn-care-services", "lawn-mowing-services", "lawn-overseeding", "mulching-services", "organic-mulch-services", "pet-friendly-landscaping", "professional-landscaping", "seasonal-clean-up"]
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Hero Title", name: "heroTitle", widget: "string" }
              - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
              - { label: "Hero Image", name: "heroImage", widget: "image" }
              - { label: "Overview Title", name: "overviewTitle", widget: "string" }
              - { label: "Overview Text", name: "overviewText", widget: "text" }
              - label: "Content Sections"
                name: "sections"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Body", name: "body", widget: "text" }
                  - { label: "Image", name: "image", widget: "image" }
                  - { label: "Image Alt Text", name: "imageAlt", widget: "string" }
              - label: "Benefits"
                name: "benefits"
                widget: "list"
                fields:
                  - label: "Icon"
                    name: "iconKey"
                    widget: "select"
                    options: ["star", "heart", "shield", "time"]
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
              - { label: "Includes", name: "includes", widget: "list", required: false, field: { label: "Item", name: "item", widget: "string" } }
              - label: "FAQ"
                name: "faq"
                widget: "list"
                required: false
                fields:
                  - { label: "Question", name: "question", widget: "string" }
                  - { label: "Answer", name: "answer", widget: "text" }
              - { label: "CTA Title", name: "ctaTitle", widget: "string" }
              - { label: "CTA Text", name: "ctaText", widget: "text" }
              - { label: "CTA Primary Label", name: "ctaPrimaryLabel", widget: "string" }
              - { label: "CTA Primary URL", name: "ctaPrimaryHref", widget: "string" }
              - { label: "CTA Secondary Label", name: "ctaSecondaryLabel", widget: "string" }
